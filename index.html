<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Shop Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{background:#111;color:#fff;font-family:sans-serif;padding:20px;max-width:800px;margin:auto}
h2,h3{color:#00ff88}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box}
button{background:#00ff88;color:#000;font-weight:bold;cursor:pointer}
button:hover{opacity:0.8}
.product-item,.order-item{background:#222;padding:15px;margin:10px 0;border-radius:10px;border-left:4px solid #00ff88}
.delete-btn{background:#ff4444;color:#fff;margin-top:8px}
.delete-btn:hover{background:#cc0000}
img{max-width:100px;border-radius:8px;margin-right:10px;float:left}
</style>
</head>
<body>

<h2>🔥 Aura Shop - Main Admin Panel</h2>

<h3>Add Product</h3>
<input id="pname" placeholder="Product Name">
<input id="pprice" placeholder="Product Price TK">
<input id="pimg" placeholder="Product Image URL">
<input id="pdesc" placeholder="Product Description">
<button onclick="addProduct()">Add Product</button>

<hr>
<h3>📦 Product List - এখান থেকে Delete করবা</h3>
<div id="productList">Loading...</div>

<hr>
<h3>📋 All Orders - এখান থেকে Order Delete করবা</h3>
<div id="orderList">Loading...</div>

<script>
// ===== তোমার Firebase Config =====
const firebaseConfig = {
  apiKey: "AIzaSyAeL4HVPaea7ZCfI3jg1HFcJlv1nxnOm8g",
  authDomain: "aura-premium-shop.firebaseapp.com",
  databaseURL: "https://aura-premium-shop-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "aura-premium-shop",
  storageBucket: "aura-premium-shop.firebasestorage.app",
  messagingSenderId: "716630218001",
  appId: "1:716630218001:web:74abbe23e91048877568b0",
  measurementId: "G-2573R0CVRE"
};
// ============================================

// পুরান SDK এর জন্য compat use করতেছি
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Product দেখানো + Delete
db.ref('products').on('value', snap=>{
  let html='';
  snap.forEach(child=>{
    let p = child.val();
    html += `<div class="product-item" style="overflow:auto">
      <img src="${p.img}" alt="">
      <b>${p.name}</b> - ${p.price} TK<br>
      <small>${p.desc}</small><br>
      <button class="delete-btn" onclick="deleteProduct('${child.key}')">Delete Product</button>
    </div>`;
  });
  document.getElementById('productList').innerHTML = html || 'কোনো Product নাই';
});

function addProduct(){
  if(pname.value=='' || pprice.value==''){alert('Name আর Price দাও'); return;}
  db.ref('products').push({
    name: pname.value,
    price: pprice.value,
    img: pimg.value,
    desc: pdesc.value
  });
  alert('Product Add হইছে!');
  pname.value=''; pprice.value=''; pimg.value=''; pdesc.value='';
}

function deleteProduct(id){
  if(confirm('এই Product Delete করবা?')) db.ref('products/'+id).remove();
}

// Order দেখানো + Delete
db.ref('orders').on('value', snap=>{
  let html='';
  snap.forEach(child=>{
    let o = child.val();
    html += `<div class="order-item">
      <b>Name:</b> ${o.name}<br>
      <b>Phone:</b> ${o.phone}<br>
      <b>Product:</b> ${o.product}<br>
      <b>Address:</b> ${o.address}<br>
      <button class="delete-btn" onclick="deleteOrder('${child.key}')">Delete Order</button>
    </div>`;
  });
  document.getElementById('orderList').innerHTML = html || 'কোনো Order নাই';
});

function deleteOrder(id){
  if(confirm('এই Order Delete করবা?')) db.ref('orders/'+id).remove();
}
</script>
</body>
</html>
