<!DOCTYPE html>
<html lang="bn">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Shop</title>
<style>
:root { --bg: #0d0d0d; --main: #ff3333; }
body{background:var(--bg);color:white;font-family:Inter;padding:20px;margin:0}
.product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.product{background:#1a1a1a;padding:15px;border-radius:15px;text-align:center}
.product img{width:100%;height:200px;object-fit:cover;border-radius:10px}
input,button,textarea,select{padding:12px;margin:8px 0;border-radius:8px;border:none;width:95%;background:#222;color:white}
button{background:var(--main);font-weight:bold;cursor:pointer}
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:#000c;display:none;justify-content:center;align-items:center;z-index:999}
.popup-content{background:#1a1a1a;padding:20px;border-radius:15px;width:90%;max-width:400px}
.close{float:right;color:red;font-size:24px;cursor:pointer}
.reply-box{background:#111;padding:10px;margin-top:10px;border-left:3px solid var(--main);font-size:14px}
</style>
</head>
<body>

<h1 style="text-align:center;color:var(--main)">🔥 AURA SHOP 🔥</h1>
<div id="products" class="product-grid">Loading...</div>

<button onclick="openAdminPanel()">Main Admin</button>
<button onclick="openOrderAdminPanel()">Order Admin</button>
<button onclick="openSupportAdminPanel()">Support Admin</button>
<button onclick="openSupport()">Support</button>

<!-- Reply Form for URL -->
<div id="replyForm" class="popup"><div class="popup-content">
<h3 id="replyTitle">Reply</h3>
<input id="replyInput" placeholder="TrxID / সমস্যার Details লিখুন">
<button onclick="submitReply()">Submit</button>
</div></div>

<!-- Order Popup -->
<div id="orderPopup" class="popup"><div class="popup-content">
<span class="close" onclick="closePopup('orderPopup')">&times;</span>
<h3>অর্ডার কনফার্ম করুন</h3>
<input id="oname" placeholder="আপনার নাম">
<input id="omobile" placeholder="আপনার মোবাইল">
<textarea id="oaddr" placeholder="আপনার ঠিকানা"></textarea>
<button onclick="placeOrder()">WhatsApp এ অর্ডার দিন</button>
</div></div>

<!-- Support Popup -->
<div id="supportPopup" class="popup"><div class="popup-content">
<span class="close" onclick="closePopup('supportPopup')">&times;</span>
<h3>সাপোর্ট টিকেট</h3>
<input id="sname" placeholder="নাম">
<input id="smobile" placeholder="মোবাইল">
<select id="sissue"><option>সমস্যা সিলেক্ট করুন</option><option>প্রোডাক্ট ইস্যু</option><option>পেমেন্ট ইস্যু</option><option>অন্যান্য</option></select>
<input id="strxid" placeholder="TrxID যদি থাকে">
<input id="sscreenshot" placeholder="Screenshot URL">
<button onclick="submitSupport()">সাপোর্টে পাঠান</button>
</div></div>

<!-- Main Admin Panel -->
<div id="adminPanel" class="popup"><div class="popup-content">
<span class="close" onclick="closePopup('adminPanel')">&times;</span>
<h3>Main Admin Login</h3>
<input id="adminPass" type="password" placeholder="Password: Niyaz@@@@">
<button onclick="loginMainAdmin()">Login</button>
<div id="adminBody" style="display:none">
<h4>Add Order Admin</h4>
<input id="aName" placeholder="Admin Name">
<input id="aMobile" placeholder="Admin WhatsApp 8801...">
<input id="aBkash" placeholder="Admin Bkash/Nagad">
<button onclick="addAdmin()">Add</button>
<h4>Add Support Admin</h4>
<input id="sAName" placeholder="Support Admin Name">
<input id="sAMobile" placeholder="Support Admin WhatsApp">
<button onclick="addSupportAdmin()">Add</button>
<h4>All Orders</h4><div id="allOrders"></div>
<h4>All Support</h4><div id="allSupport"></div>
</div>
</div></div>

<!-- Order Admin Panel -->
<div id="orderAdminPanel" class="popup"><div class="popup-content">
<span class="close" onclick="closePopup('orderAdminPanel')">&times;</span>
<h3>Order Admin Login</h3>
<input id="orderAdminPass" type="password" placeholder="Password: niyaz@@">
<button onclick="loginOrderAdmin()">Login</button>
<div id="orderAdminBody" style="display:none"><h4>আমার অর্ডার</h4><div id="myOrders"></div></div>
</div></div>

<!-- Support Admin Panel -->
<div id="supportAdminPanel" class="popup"><div class="popup-content">
<span class="close" onclick="closePopup('supportAdminPanel')">&times;</span>
<h3>Support Admin Login</h3>
<input id="supportAdminPass" type="password" placeholder="Password: Niyz@@@">
<button onclick="loginSupportAdmin()">Login</button>
<div id="supportAdminBody" style="display:none"><h4>আমার সাপোর্ট টিকেট</h4><div id="mySupport"></div></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, get, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {apiKey: "AIzaSyAeL4HVPaea7ZCfI3jg1HFcJlv1nxnOm8g", authDomain: "aura-premium-shop.firebaseapp.com", databaseURL: "https://aura-premium-shop-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "aura-premium-shop", storageBucket: "aura-premium-shop.firebasestorage.app", messagingSenderId: "716630218001", appId: "1:716630218001:web:74abbe23e91048877568b0"};
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
let currentProduct = null; let orderAdmins = []; let supportAdmins = [];
let replyType = ""; let replyId = "";

// URL থেকে Reply ধরবে
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.has('replyOrder')){ replyType="order"; replyId=urlParams.get('replyOrder'); document.getElementById('replyTitle').innerText="TrxID জমা দিন"; document.getElementById('replyForm').style.display='flex'; }
if(urlParams.has('replySupport')){ replyType="support"; replyId=urlParams.get('replySupport'); document.getElementById('replyTitle').innerText="সমস্যার Details লিখুন"; document.getElementById('replyForm').style.display='flex'; }

window.submitReply = function(){
const val = document.getElementById('replyInput').value;
if(!val){alert("লিখুন");return;}
if(replyType=="order"){ update(ref(db,'orders/'+replyId),{trxid:val}); alert("TrxID জমা হয়েছে"); }
if(replyType=="support"){ update(ref(db,'supportTickets/'+replyId),{customerReply:val}); alert("Reply জমা হয়েছে"); }
closePopup('replyForm');
}

onValue(ref(db, 'products'), (s) => {
const div = document.getElementById('products'); div.innerHTML="";
if(s.exists()) s.forEach((c) => {
const p = c.val();
div.innerHTML += `<div class="product"><img src="${p.img}"><h3>${p.name}</h3><p>দাম: ${p.price} TK</p><button onclick="openOrder('${c.key}','${p.name}',${p.price})">Order Now</button></div>`;
});
});

onValue(ref(db, 'orderAdmins'), (s) => { orderAdmins = []; if(s.exists()) s.forEach(c=>orderAdmins.push({id:c.key, ...c.val()})); });
onValue(ref(db, 'supportAdmins'), (s) => { supportAdmins = []; if(s.exists()) s.forEach(c=>supportAdmins.push({id:c.key, ...c.val()})); });

onValue(ref(db, 'orders'), (s) => { 
let html=""; if(s.exists()) s.forEach(c=>{let o=c.val(); html+=`<div class="reply-box"><b>Order:</b> ${o.product}<br><b>Customer:</b> ${o.customerMobile}<br><b>TrxID:</b> ${o.trxid||'দেয়নি'}<br><b>Admin:</b> ${o.adminName}</div>`}); 
document.getElementById('allOrders').innerHTML=html; 
document.getElementById('myOrders').innerHTML=html; // Order admin ও দেখবে
});

onValue(ref(db, 'supportTickets'), (s) => { 
let html=""; if(s.exists()) s.forEach(c=>{let o=c.val(); html+=`<div class="reply-box"><b>Support:</b> ${o.issue}<br><b>Customer:</b> ${o.mobile}<br><b>Reply:</b> ${o.customerReply||'দেয়নি'}</div>`}); 
document.getElementById('allSupport').innerHTML=html; 
document.getElementById('mySupport').innerHTML=html; // Support admin ও দেখবে
});

window.openOrder = (id,name,price)=>{ currentProduct={id,name,price}; document.getElementById('orderPopup').style.display='flex'; }
window.closePopup = (id)=> document.getElementById(id).style.display='none';
window.openAdminPanel = ()=> document.getElementById('adminPanel').style.display='flex';
window.openOrderAdminPanel = ()=> document.getElementById('orderAdminPanel').style.display='flex';
window.openSupportAdminPanel = ()=> document.getElementById('supportAdminPanel').style.display='flex';
window.openSupport = ()=> document.getElementById('supportPopup').style.display='flex';

window.placeOrder = async function(){
const name=document.getElementById('oname').value;
const mobile=document.getElementById('omobile').value;
const addr=document.getElementById('oaddr').value;
if(!name||!mobile||!addr){alert("সব দিন");return;}

orderAdmins.forEach((admin,i)=>{
const orderId = push(ref(db,'orders'),{...currentProduct,customerName:name,customerMobile:mobile,addr,status:"Pending",adminId:admin.id,adminName:admin.name,trxid:"",time:new Date().toLocaleString("bn-BD")}).key;
let adminMsg = `নতুন অর্ডার 🔥%0AOrderID: ${orderId}%0AProduct: ${currentProduct.name}%0AName: ${name}%0AMobile: ${mobile}`;
setTimeout(()=> window.open(`https://wa.me/${admin.mobile}?text=${adminMsg}`, '_blank'), i*1500);
setTimeout(()=>{ let customerMsg = `ধন্যবাদ ${name} অর্ডারের জন্য।%0Aএডমিন: ${admin.name}%0APayment: ${admin.bkash}%0A%0ATrxID দিন: ${window.location.origin}${window.location.pathname}?replyOrder=${orderId}`; window.open(`https://wa.me/${mobile}?text=${customerMsg}`, '_blank'); }, i*1500 + 2000);
});
alert("✅ অর্ডার সাবমিট"); closePopup('orderPopup');
}

window.submitSupport = function(){
const name=document.getElementById('sname').value; const mobile=document.getElementById('smobile').value; const issue=document.getElementById('sissue').value;
const ticketId = push(ref(db,'supportTickets'),{name,mobile,issue,trxid:document.getElementById('strxid').value,ss:document.getElementById('sscreenshot').value,customerReply:"",time:new Date().toLocaleString("bn-BD")}).key;
supportAdmins.forEach(c=> window.open(`https://wa.me/${c.mobile}?text=নতুন সাপোর্ট: ${ticketId} - ${issue} - ${mobile}`,'_blank'));
setTimeout(()=>{ let botMsg = `ধন্যবাদ।%0ADetails দিন: ${window.location.origin}${window.location.pathname}?replySupport=${ticketId}`; window.open(`https://wa.me/${mobile}?text=${botMsg}`,'_blank'); },2000);
alert("সাপোর্ট টিকেট গেছে"); closePopup('supportPopup');
}

window.loginMainAdmin = ()=>{ if(document.getElementById('adminPass').value=="Niyaz@@@@"){ document.getElementById('adminBody').style.display='block'; }else alert("Wrong Password"); }
window.loginOrderAdmin = ()=>{ if(document.getElementById('orderAdminPass').value=="niyaz@@"){ document.getElementById('orderAdminBody').style.display='block'; }else alert("Wrong Password"); }
window.loginSupportAdmin = ()=>{ if(document.getElementById('supportAdminPass').value=="Niyz@@@"){ document.getElementById('supportAdminBody').style.display='block'; }else alert("Wrong Password"); }

window.addAdmin = ()=>{ push(ref(db,'orderAdmins'),{name:document.getElementById('aName').value,mobile:document.getElementById('aMobile').value,bkash:document.getElementById('aBkash').value}); }
window.addSupportAdmin = ()=>{ push(ref(db,'supportAdmins'),{name:document.getElementById('sAName').value,mobile:document.getElementById('sAMobile').value}); }
</script>
</body>
</html>
