<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>AURA SHOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:'Arial',sans-serif;background:#0f0f0f;color:white;text-align:center;padding:20px;margin:0}
.product{background:#1a1a1a;padding:20px;margin:15px;border-radius:15px;display:inline-block;width:300px;box-shadow:0 0 10px #ff660044;vertical-align:top;text-align:left}
input,button{padding:12px;margin:8px;border-radius:8px;border:none;width:90%;font-size:16px}
button{background:#ff6600;color:white;cursor:pointer;font-weight:bold}
button:hover{background:#ff8800}
h1{color:#ff6600;font-size:32px;text-align:center}
.footer{background:#1a1a1a;padding:20px;margin-top:40px;border-radius:15px;text-align:left;max-width:500px;margin-left:auto;margin-right:auto}
.number{font-size:22px;color:#00ff88;font-weight:bold}
.pay-box{background:#222;padding:12px;border-radius:10px;margin:10px 0}
img{border-radius:10px;width:100%;margin-bottom:10px}
.desc{font-size:14px;color:#ccc;margin:10px 0;line-height:1.6}
</style>
</head>
<body> 

<h1>🔥 AURA SHOP 🔥</h1>
<p style="text-align:center">আপনার পছন্দের সব প্রোডাক্ট - 24/7 Service</p>

<div id="products"><p style="text-align:center">Loading products...</p></div>
<p id="status" style="color:lime;font-size:18px;text-align:center"></p>

<div class="footer">
<h3>📞 যোগাযোগ ও পেমেন্ট</h3>
<div class="pay-box"><b>বিকাশ:</b> <span class="number">01908807313</span></div>
<div class="pay-box"><b>নগদ:</b> <span class="number">01908807313</span></div>
<p><b>WhatsApp:</b> <span class="number">01908807313</span></p>
<p><b>Telegram:</b> <span class="number">@niyaz_official</span></p>
<hr style="border-color:#333;">
<p style="font-size:14px;color:#aaa;"><b>অর্ডার করার নিয়ম:</b><br>1. প্রোডাক্ট সিলেক্ট করে নাম + ঠিকানা দিন<br>2. Order Now চাপুন<br>3. বিকাশ/নগদে পেমেন্ট করুন</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {apiKey: "AIzaSyAeL4HVPaea7ZCfI3jg1HFcJlv1nxnOm8g", authDomain: "aura-premium-shop.firebaseapp.com", databaseURL: "https://aura-premium-shop-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "aura-premium-shop", storageBucket: "aura-premium-shop.firebasestorage.app", messagingSenderId: "716630218001", appId: "1:716630218001:web:74abbe23e91048877568b0"};
const app = initializeApp(firebaseConfig); const db = getDatabase(app);

onValue(ref(db, 'products'), (snapshot) => {
const productsDiv = document.getElementById('products'); productsDiv.innerHTML = "";
if(snapshot.exists()){ snapshot.forEach((child) => { const p = child.val(); let imgTag = p.img ? `<img src="${p.img}">` : '';
productsDiv.innerHTML += `<div class="product">${imgTag}<h2>${p.name}</h2><p style="font-size:20px;color:#ff6600">দাম: ${p.price} TK</p><p class="desc"><b>বিবরণ:</b><br>${p.desc || 'কোনো বিবরণ নেই'}</p><input id="cname-${child.key}" placeholder="আপনার নাম"><input id="caddr-${child.key}" placeholder="ঠিকানা + মোবাইল"><button onclick="order('${child.key}','${p.name}', ${p.price})">Order Now</button></div>`; }); } 
else { productsDiv.innerHTML = "<p style='color:red;text-align:center'>শীঘ্রই প্রোডাক্ট আসবে</p>"; } });

window.order = function(id, item, price){ const name = document.getElementById(`cname-${id}`).value; const addr = document.getElementById(`caddr-${id}`).value;
if(name === "" || addr === ""){ alert("নাম এবং ঠিকানা দিন"); return; }
push(ref(db, 'orders'), {item: item, price: price, name: name, address: addr, time: new Date().toLocaleString("bn-BD")});
document.getElementById('status').innerText = "✅ অর্ডার সফল! আমরা WhatsApp এ যোগাযোগ করবো"; document.getElementById(`cname-${id}`).value = ""; document.getElementById(`caddr-${id}`).value = ""; }
</script>
</body>
</html>
