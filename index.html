<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA PREMIUM SHOP</title>
<style>
body{font-family:sans-serif;background:#0f0f0f;color:white;margin:0;padding:20px}
h1{color:#ff8800;text-align:center}
.admin{display:none;background:#1a1a1a;padding:20px;border-radius:10px;margin-bottom:20px;border:1px solid #ff8800}
input,textarea{width:95%;padding:10px;margin:5px;border-radius:5px;border:none;background:#222;color:white}
button{background:#ff8800;color:black;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;margin:5px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));gap:15px}
.product{background:#1a1a1a;padding:15px;border-radius:10px;border:1px solid #333;text-align:center}
.product img{width:100%;height:180px;object-fit:cover;border-radius:8px}
.footer{background:#111;padding:20px;margin-top:30px;border-radius:10px;text-align:center}
a{color:#ff8800;text-decoration:none}
</style>
</head>
<body>
<img src="received_2015456459412794.jpeg" width="60" style="display:block;margin:0 auto">
<h1>AURA PREMIUM SHOP</h1>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin">
  <h2 style="color:#ff8800">Admin থেকে প্রোডাক্ট অ্যাড করুন</h2>
  <input type="text" id="pName" placeholder="প্রোডাক্ট নাম">
  <input type="text" id="pPrice" placeholder="দাম যেমন: 22000 টাকা">
  <input type="text" id="pImg" placeholder="প্রোডাক্ট ছবির URL লিংক">
  <textarea id="pDesc" placeholder="প্রোডাক্ট ডিসক্রিপশন"></textarea>
  <button onclick="addProduct()">Product Add করুন</button>
  <button onclick="clearProducts()" style="background:red">সব ডিলিট</button>
</div>

<h2 style="text-align:center">আমাদের প্রোডাক্ট সমূহ</h2>
<div id="productList" class="product-grid"></div>

<!-- ORDER FORM -->
<div id="orderForm" style="display:none;background:#1a1a1a;padding:20px;border-radius:10px;margin-top:20px">
  <h2 id="orderTitle" style="color:#ff8800"></h2>
  <input type="text" id="cName" placeholder="আপনার নাম">
  <input type="tel" id="cPhone" placeholder="ফোন নাম্বার">
  <input type="email" id="cEmail" placeholder="ইমেইল এড্রেস">
  <textarea id="cAddress" placeholder="সম্পূর্ণ ঠিকানা"></textarea>
  <button onclick="submitOrder()">WhatsApp এ অর্ডার করুন</button>
</div>

<!-- CONTACT FOOTER -->
<div class="footer">
  <h3>পেমেন্ট ও যোগাযোগ</h3>
  <p><b>বিকাশ/নগদ:</b> 01908807313</p>
  <p><b>WhatsApp:</b> <a href="https://wa.me/8801908807313">01908807313</a></p>
  <p><b>Telegram:</b> <a href="https://t.me/niyaz_official">@niyaz_official</a></p>
  <p style="font-size:12px;color:gray">অর্ডার কনফার্ম করতে আগে 50% পেমেন্ট করুন</p>
</div>

<script>
let products = JSON.parse(localStorage.getItem('aura_products')) || [];
let selectedProduct = "";

// Admin Check
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.has('niyazboss')){
  document.getElementById('adminPanel').style.display = 'block';
}

function addProduct(){
  let name = document.getElementById('pName').value;
  let price = document.getElementById('pPrice').value;
  let img = document.getElementById('pImg').value;
  let desc = document.getElementById('pDesc').value;
  if(name=="" || price=="" || img==""){ alert("নাম, দাম, ছবির URL দিন"); return; }
  products.push({name, price, img, desc});
  localStorage.setItem('aura_products', JSON.stringify(products));
  alert("Product Added!");
  loadProducts();
  document.getElementById('pName').value="";
  document.getElementById('pPrice').value="";
  document.getElementById('pImg').value="";
  document.getElementById('pDesc').value="";
}

function loadProducts(){
  let html = "";
  products.forEach((p, i)=>{
    html += `<div class="product">
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <p style="color:#ff8800;font-weight:bold">${p.price}</p>
      <p style="font-size:14px">${p.desc}</p>
      <button onclick="orderNow('${p.name}')">অর্ডার করুন</button>
    </div>`;
  });
  document.getElementById('productList').innerHTML = html;
}

function orderNow(name){
  selectedProduct = name;
  document.getElementById('orderTitle').innerText = name + " অর্ডার করুন";
  document.getElementById('orderForm').style.display = 'block';
  window.scrollTo(0,document.body.scrollHeight);
}

function submitOrder(){
  let name = document.getElementById('cName').value;
  let phone = document.getElementById('cPhone').value;
  let email = document.getElementById('cEmail').value;
  let address = document.getElementById('cAddress').value;
  if(name=="" || phone=="" || address==""){ alert("নাম, ফোন, ঠিকানা দিন"); return; }
  
  let msg = `নতুন অর্ডার:%0Aপ্রোডাক্ট: ${selectedProduct}%0Aনাম: ${name}%0Aফোন: ${phone}%0Aইমেইল: ${email}%0Aঠিকানা: ${address}`;
  window.open(`https://wa.me/8801908807313?text=${msg}`);
}

function clearProducts(){
  if(confirm("সব প্রোডাক্ট ডিলিট করবেন?")){
    products = [];
    localStorage.setItem('aura_products', JSON.stringify(products));
    loadProducts();
  }
}

loadProducts();
</script>

</body>
</html>
