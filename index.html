<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>AURA SHOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:'Arial',sans-serif;background:#0f0f0f;color:white;text-align:center;padding:20px;margin:0}
.product{background:#1a1a1a;padding:20px;margin:15px;border-radius:15px;display:inline-block;width:300px;box-shadow:0 0 10px #ff660044;vertical-align:top;text-align:left}
input,button{padding:12px;margin:8px;border-radius:8px;border:none;width:90%;font-size:16px}
button{background:#ff6600;color:white;cursor:pointer;font-weight:bold}
button:hover{background:#ff8800}
h1{color:#ff6600;font-size:32px;text-align:center}
.footer{background:#1a1a1a;padding:20px;margin-top:40px;border-radius:15px;text-align:left;max-width:500px;margin-left:auto;margin-right:auto}
.number{font-size:22px;color:#00ff88;font-weight:bold}
.support-box{background:#222;border:2px solid #ff6600;padding:15px;border-radius:10px;margin:15px 0}
img{border-radius:10px;width:100%;margin-bottom:10px}
.desc{font-size:14px;color:#ccc;margin:10px 0;line-height:1.6}
</style>
</head>
<body> 

<h1>🔥 AURA SHOP 🔥</h1>
<p style="text-align:center">আপনার পছন্দের সব প্রোডাক্ট - 24/7 Service</p>

<div id="products"><p style="text-align:center">Loading products...</p></div>
<p id="status" style="color:lime;font-size:18px;text-align:center"></p>

<div class="footer">
<h3>🛡️ সাপোর্ট</h3>
<div class="support-box">
<p><b>কোনো সমস্যা হলে যোগাযোগ করুন:</b></p>
<p><b>Support Admin WhatsApp:</b> <a href="https://wa.me/8801965067388" target="_blank" style="color:#00ff88;font-size:20px">01965067388</a></p>
<p style="font-size:13px;color:#aaa">অর্ডার, পেমেন্ট বা অন্য সমস্যার জন্য এই নাম্বারে মেসেজ দিন</p>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {apiKey: "AIzaSyAeL4HVPaea7ZCfI3jg1HFcJlv1nxnOm8g", authDomain: "aura-premium-shop.firebaseapp.com", databaseURL: "https://aura-premium-shop-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "aura-premium-shop", storageBucket: "aura-premium-shop.firebasestorage.app", messagingSenderId: "716630218001", appId: "1:716630218001:web:74abbe23e91048877568b0"};
const app = initializeApp(firebaseConfig); const db = getDatabase(app);

// নাম্বার 2টা। 88 দিয়ে শুরু
const ORDER_WHATSAPP = "8801908807313"; // অর্ডার এই নাম্বারে যাবে
const SUPPORT_WHATSAPP = "8801965067388"; // সাপোর্ট এই নাম্বারে

onValue(ref(db, 'products'), (snapshot) => {
const productsDiv = document.getElementById('products'); productsDiv.innerHTML = "";
if(snapshot.exists()){ snapshot.forEach((child) => { const p = child.val(); let imgTag = p.img ? `<img src="${p.img}">` : '';
productsDiv.innerHTML += `<div class="product">${imgTag}<h2>${p.name}</h2><p style="font-size:20px;color:#ff6600">দাম: ${p.price} TK</p><p class="desc"><b>বিবরণ:</b><br>${p.desc || 'কোনো বিবরণ নেই'}</p><input id="cmobile-${child.key}" type="tel" placeholder="আপনার মোবাইল নাম্বার 01XXXXXXXXX"><button onclick="order('${child.key}','${p.name}', ${p.price})">Order Now</button></div>`; }); } 
else { productsDiv.innerHTML = "<p style='color:red;text-align:center'>শীঘ্রই প্রোডাক্ট আসবে</p>"; } });

window.order = function(id, item, price){ 
const mobile = document.getElementById(`cmobile-${id}`).value; 
if(mobile === "" || mobile.length < 11){ alert("সঠিক মোবাইল নাম্বার দিন"); return; }

// 1. Firebase এ Save
push(ref(db, 'orders'), {item: item, price: price, mobile: mobile, time: new Date().toLocaleString("bn-BD")});

// 2. Success মেসেজ
document.getElementById('status').innerText = "✅ অর্ডার সফল! 2 সেকেন্ডে WhatsApp খুলবে"; 
document.getElementById(`cmobile-${id}`).value = ""; 

// 3. Auto WhatsApp এ মেসেজ - Main Admin এর কাছে
let message = `নতুন অর্ডার এসেছে 🔥%0A%0AProduct: ${item}%0APrice: ${price}TK%0ACustomer Mobile: ${mobile}%0ATime: ${new Date().toLocaleString("bn-BD")}`;
let whatsappURL = `https://wa.me/${ORDER_WHATSAPP}?text=${message}`;

// 2 সেকেন্ড পর অটো রিডাইরেক্ট
setTimeout(() => { window.location.href = whatsappURL; }, 2000);

}
</script>
</body>
</html>
